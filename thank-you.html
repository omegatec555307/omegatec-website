<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Thank You | Omegatec Computers Sdn. Bhd.</title>
<style>
    :root {
      --primary: #004080;
      --secondary: #002b56;
      --accent: #f39c12;
      --light: #f9f9f9;
    }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      line-height: 1.6;
      color: #333;
      background: var(--light);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .titlebar {
      background: rgba(0,43,86,0.95);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .titlebar .logo img { width: 40px; height: 40px; object-fit: contain; }
    .title-text h1 { margin: 0; font-size: 1.6rem; }
    .title-text p { margin: 2px 0 0; opacity: .9; font-size: 0.9rem; }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-top: 5px solid var(--primary);
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
    }
    .btn:hover { background: var(--secondary); }
    footer {
      background: var(--secondary);
      color: white;
      text-align: center;
      padding: 24px 20px;
      margin-top: auto;
    }
</style>
</head>
<body>
<div class="titlebar">
  <div class="logo"><img alt="Omegatec Logo" src="omega-logo.png"/></div>
  <div class="title-text">
    <h1>Omegatec Computers Sdn. Bhd.</h1>
    <p>IT Solutions That Transform Your Business</p>
  </div>
</div>

<div class="container">
  <h2 style="color: var(--primary);">Thank You for Contacting Us!</h2>
  <p>We have received your message. Our team will review your inquiry and get back to you as soon as possible.</p>
  <a class="btn" href="index.html">Return to Homepage</a>
</div>

<footer>
  <p>&copy; 2026 Omegatec Computers Sdn. Bhd. All Rights Reserved.</p>
</footer>
</body>
</html>
