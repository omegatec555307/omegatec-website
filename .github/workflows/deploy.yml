name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Core Website Files
        run: |
          echo "Checking essential files..."
          test -f index.html || (echo "ERROR: index.html is missing!" && exit 1)
          test -f CNAME || (echo "ERROR: CNAME is missing!" && exit 1)
          test -f omega-logo.png || (echo "ERROR: omega-logo.png is missing!" && exit 1)
          test -f .nojekyll || (echo "ERROR: .nojekyll is missing!" && exit 1)
          echo "All essential files verified successfully."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
